let ex="1",list=[],idx=0,sample=null,voice=null;const cache={};
const $=i=>document.getElementById(i);
function pick(){const v=speechSynthesis.getVoices();voice=v.find(x=>/en[-_]US/i.test(x.lang))||v.find(x=>/^en/i.test(x.lang))||null}
if("speechSynthesis"in window){pick();speechSynthesis.onvoiceschanged=pick}
function say(t,rate){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";if(voice)u.voice=voice;u.rate=rate||.9;speechSynthesis.speak(u)}
const speakable=w=>w.replace(/\s*\/\s*/g,", ").replace(/^be /,"");

function grid(){const s=$("q").value.trim().toLowerCase();
list=DATA[ex].filter(r=>!s||r[0].toLowerCase().includes(s)||r[1].includes(s));
$("grid").innerHTML=list.map((r,i)=>`<button class="w" data-i="${i}">${r[0]}</button>`).join("")||'<p class="sub">ما فيه نتائج.</p>'}
tabs();grid();
$("tabs").onclick=e=>{const b=e.target.closest(".tab");if(!b)return;ex=b.dataset.k;$("q").value="";tabs();grid()};
$("q").oninput=grid;

async function open(i){idx=i;const r=list[i];$("ov").classList.add("on");
$("en").textContent=r[0];$("ar").textContent=r[1];$("syn").textContent=r[2]?"≈ "+r[2]:"";
$("se").textContent="…";$("sa").textContent="";say(speakable(r[0]));
const key=r[0];
if(!cache[key]&&SENT[key])cache[key]={en:SENT[key],ar:SENTAR[key]||""};
if(!cache[key]){
 try{sample=sample||await claude.use("sample");
  if(!sample)throw 0;
  const p=`اكتب جملة إنجليزية قصيرة وبسيطة (6-12 كلمة) تستخدم الكلمة أو التعبير "${speakable(r[0])}" بمعنى "${r[1]}" في سياق عسكري أو يومي مناسب لاختبار ALCPT. أرجع JSON فقط بهذا الشكل: {"en":"الجملة","ar":"ترجمتها للعربية"}`;
  cache[key]=await sample.json(p,{modelTier:"quick"});
 }catch(err){cache[key]={en:"",ar:"ما أُضيفت جملة لهذي الكلمة بعد."};if(sample)delete cache[key]}}
if(idx===i&&cache[key]){$("se").textContent=cache[key].en||"—";$("sa").textContent=cache[key].ar}}
$("sp").onclick=()=>say(speakable(list[idx][0]));
$("sp2").onclick=()=>{const c=cache[list[idx][0]];if(c&&c.en)say(c.en,.85)};
$("nx").onclick=()=>open((idx+1)%list.length);$("pv").onclick=()=>open((idx-1+list.length)%list.length);

$("ov").onclick=e=>{if(e.target.id==="ov")$("cl").onclick()};

function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
let Q=null;
function startQuiz(scope){
 let pool=scope==='all'?Object.values(DATA).flat():DATA[scope];const seen=new Set();
 pool=pool.filter(r=>r[1]&&!seen.has(r[0])&&seen.add(r[0]));
 const n=scope==='all'?30:15;
 const picks=shuffle(pool).slice(0,Math.min(n,pool.length));
 Q={scope,i:0,score:0,done:false,wrong:[],items:picks.map((r,k)=>{const rev=k%2===1;
  const others=shuffle(pool.filter(x=>x[0]!==r[0]&&x[1]!==r[1])).slice(0,3);
  const opts=shuffle([r,...others]);return{r,rev,opts,ans:opts.indexOf(r)}})};
 $('qz').classList.add('on');showQ()}
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function showQ(){
 const it=Q.items[Q.i],tot=Q.items.length,title=Q.scope==='all'?'الاختبار الشامل':'اختبار نموذج '+Q.scope;
 $('qb').innerHTML=`<div class="qtop"><button data-a="x">✕ خروج</button><span>${title}</span><span>${Q.i+1} / ${tot}</span></div>
 <div class="bar"><i style="width:${Q.i/tot*100}%"></i></div>
 <p class="qq ${it.rev?'':'e'}">${esc(it.rev?it.r[1]:it.r[0])}</p>
 <p class="qh">${it.rev?'اختر الكلمة الإنجليزية الصحيحة':'اختر المعنى الصحيح'} ${it.rev?'':'<button class="ic" data-a="s" style="width:32px;height:32px;vertical-align:middle" aria-label="نطق">🔊</button>'}</p>
 ${it.opts.map((o,k)=>`<button class="opt ${it.rev?'e':''}" data-o="${k}">${esc(it.rev?o[0]:o[1])}</button>`).join('')}
 <div id="qf"></div>`;
 Q.done=false;if(!it.rev)say(speakable(it.r[0]))}
function answer(k){if(Q.done)return;Q.done=true;const it=Q.items[Q.i],bs=$('qb').querySelectorAll('.opt');
 bs[it.ans].classList.add('ok');
 if(k===it.ans)Q.score++;else{bs[k].classList.add('no');Q.wrong.push(it.r)}
 if(it.rev)say(speakable(it.r[0]));
 $('qf').innerHTML=`<button class="qn" data-a="n">${Q.i+1<Q.items.length?'التالي ‹':'عرض النتيجة'}</button>`}
function finish(){
 const t=Q.items.length,p=Math.round(Q.score/t*100);
 const lv=p>=90?'ممتاز 🏆':p>=75?'جيد جدًا 👏':p>=60?'جيد 👍':p>=40?'مقبول، تحتاج مراجعة':'تحتاج تركيز أكثر على الكلمات';
 $('qb').innerHTML=`<div class="qtop"><button data-a="x">✕ إغلاق</button><span>النتيجة</span><span></span></div>
 <div class="sc"><b>${Q.score} / ${t}</b>${p}% — ${lv}</div>
 ${Q.wrong.length?'<h3>كلمات تحتاج مراجعتها</h3>'+Q.wrong.map((r,k)=>`<div class="rv"><button data-a="w" data-w="${k}" aria-label="نطق">🔊</button><span>${esc(r[1])}</span><span class="x">${esc(r[0])}</span></div>`).join(''):'<p class="qh">ما غلطت في أي سؤال!</p>'}
 <button class="qn" data-a="r">أعد الاختبار</button>`}
$('qb').onclick=e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.o!==undefined)return answer(+b.dataset.o);
 const a=b.dataset.a;
 if(a==='x'){$('qz').classList.remove('on');speechSynthesis.cancel()}
 else if(a==='s')say(speakable(Q.items[Q.i].r[0]))
 else if(a==='n'){Q.i++;Q.i<Q.items.length?showQ():finish()}
 else if(a==='w')say(speakable(Q.wrong[+b.dataset.w][0]))
 else if(a==='r')startQuiz(Q.scope)};

 if(F.i>=F.q.length)return fcEnd();
 const r=F.q[F.i],t=F.q.length;F.hint=0;F.lock=false;
 $('fb').innerHTML=`<div class="qtop"><button data-a="x">✕ إغلاق</button><span>${F.i+1} / ${t}</span><span></span></div><div class="bar"><i style="width:${F.i/t*100}%"></i></div>
 <p class="qq">${esc(r[1])}</p><p class="qh">${r[2]?'≈ '+esc(r[2]):'اكتب الكلمة بالإنجليزي'}</p>
 <p class="fh" id="fh"></p>
 <input id="fi" class="fi" dir="ltr" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="اكتب هنا…">
 <button class="qn" data-a="c">تحقق</button>
 <div class="fa"><button data-a="h">💡 تلميح</button><button data-a="k">لا أعرف</button></div><div id="fr"></div>`;
 fcHint();$('fi').focus()}
function fcCheck(skip){
 if(F.lock)return;F.lock=true;
 const r=F.q[F.i],v=nz($('fi').value),full=nz(r[0]);
 const ok=!skip&&!!v&&(v===full||full.split('/').includes(v));
 ok?F.ok++:F.miss.push(r);
 $('fi').disabled=true;$('fh').textContent='';
 $('fb').querySelector('.qn').dataset.a='n';$('fb').querySelector('.qn').textContent=F.i+1<F.q.length?'التالية ›':'عرض النتيجة';
 $('fb').querySelector('.fa').style.display='none';
 $('fr').innerHTML=`<div class="fr ${ok?'ok':'no'}">${ok?'✅ صح!':(skip?'الكلمة:':'❌ الكتابة الصحيحة:')} <b>${esc(r[0])}</b><button data-a="s" aria-label="نطق">🔊</button></div><div class="fs" id="fs">…</div>`;
 say(speakable(r[0]));fcSent(r)}
async function fcSent(r){
 const k=r[0];let s=cache[k]&&cache[k].en?cache[k]:(SENT[k]?{en:SENT[k],ar:SENTAR[k]||''}:null);
 if(!s){try{sample=sample||await claude.use("sample");if(sample){const j=await sample.json(`اكتب جملة إنجليزية قصيرة وبسيطة (6-12 كلمة) تستخدم الكلمة أو التعبير "${speakable(k)}" بمعنى "${r[1]}" في سياق عسكري أو يومي مناسب لاختبار ALCPT. أرجع JSON فقط بهذا الشكل: {"en":"الجملة","ar":"ترجمتها للعربية"}`,{modelTier:"quick"});if(j&&j.en)s=cache[k]=j}}catch(e){}}
 if(!s){try{const d=await (await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(speakable(k).split(', ')[0]))).json();let x=null;for(const e of d)for(const m of e.meanings)for(const f of m.definitions)if(!x&&f.example)x=f.example;if(x)s={en:x,ar:''}}catch(e){}}
 const el=$('fs');if(!el||!F||F.q[F.i]!==r)return;
 F.sen=s&&s.en;
 el.innerHTML=s&&s.en?`<div class="e"><button class="ic" data-a="t" style="width:34px;height:34px">🔊</button> ${esc(s.en)}</div>${s.ar?`<div class="a">${esc(s.ar)}</div>`:''}`:'<span class="qh">ما فيه جملة متاحة لهذي الكلمة الحين.</span>'}
function fcEnd(){
 const t=F.q.length,p=Math.round(F.ok/t*100);
 $('fb').innerHTML=`<div class="qtop"><button data-a="x">✕ إغلاق</button><span>النتيجة</span><span></span></div>
 <div class="sc"><b>${F.ok} / ${t}</b>${p}%</div>
 ${F.miss.length?'<h3>كلمات أخطأت فيها</h3>'+F.miss.map((r,k)=>`<div class="rv"><button data-a="w" data-w="${k}" aria-label="نطق">🔊</button><span>${esc(r[1])}</span><span class="x">${esc(r[0])}</span></div>`).join('')+'<button class="qn" data-a="m">راجع الأخطاء</button>':'<p class="qh">كتبتها كلها صح! 🎉</p>'}
 <button class="qn" data-a="r">أعد البطاقات</button>`}
$('fe').onclick=()=>fcStart(DATA[ex]);
$('fb').onclick=e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.a;
 if(a==='x'){$('fc').classList.remove('on');speechSynthesis.cancel()}
 else if(a==='c')fcCheck(false);else if(a==='k')fcCheck(true);
 else if(a==='h'){F.hint++;fcHint();$('fi').focus()}
 else if(a==='n'){F.i++;fcShow()}
 else if(a==='s')say(speakable(F.q[F.i][0]));
 else if(a==='t'&&F.sen)say(F.sen,.85);
 else if(a==='w')say(speakable(F.miss[+b.dataset.w][0]));
 else if(a==='m')fcStart(F.miss.slice());
 else if(a==='r')fcStart(DATA[ex])};
$('fb').onkeydown=e=>{if(e.key!=='Enter')return;e.preventDefault();F&&F.i<F.q.length&&(F.lock?(F.i++,fcShow()):fcCheck(false))};
</script></body></html>
